name: Upload IPA to App Store Connect

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct link to your IPA file'
        required: true

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Download IPA
        run: |
          curl -L -o ios-build.ipa "${{ github.event.inputs.ipa_url }}"

      - name: Setup Apple API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Upload IPA to App Store Connect
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file ./ios-build.ipa \
            --apiKey ${{ secrets.APPSTORE_KEY_ID }} \
            --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }}
